<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <title>Local Drive</title>
  <!-- An open laptop on the dusk sky, drawn on a 16x16 pixel grid with the
       scene's palette (js/palette.js) so the tab matches the art. -->
  <rect width="16" height="16" fill="#2a1438"/>

  <!-- Lid: dark chassis, teal glass, two lines of text glowing in it. -->
  <rect x="3" y="2" width="10" height="8" fill="#4a4652"/>
  <rect x="3" y="2" width="10" height="1" fill="#8d8a96"/>
  <rect x="4" y="3" width="8" height="6" fill="#1f4a44"/>
  <rect x="4" y="3" width="8" height="1" fill="#2f6a60"/>
  <rect x="5" y="5" width="3" height="1" fill="#7fd6a8"/>
  <rect x="5" y="7" width="5" height="1" fill="#3f8f78"/>

  <!-- Deck, front edge, and the contact shadow it casts. -->
  <rect x="2" y="10" width="12" height="1" fill="#a8a5b0"/>
  <rect x="1" y="11" width="14" height="1" fill="#6d6a78"/>
  <rect x="2" y="12" width="12" height="1" fill="#1f1520"/>
</svg>
